# Release workflow — norynth-chain
#
# On a push of a tag with a "v" prefix (e.g. v0.2.0), builds a linux/amd64
# binary and creates a draft prerelease with it. On a push to main, no
# release is created (only tag pushes trigger a release).
#
# ARM64 is NOT built: wasmvm has no ARM64 consensus build, so an ARM64
# binary cannot run the chain (CosmWasm is required). x86_64 only.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install libwasmvm
        run: |
          sudo mkdir -p /opt/wasmvm
          # wasmvm ships the .so in the Go module cache after `go mod download`
          go mod download github.com/CosmWasm/wasmvm/v2
          cp "$(go env GOMODCACHE)"/github.com/\!cosm\!wasm/wasmvm/v2@*/internal/api/libwasmvm.x86_64.so /opt/wasmvm/
          ls -lh /opt/wasmvm/

      - name: Build (linux/amd64)
        run: |
          mkdir -p release
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -o release/norynthd-linux-amd64 \
            -tags "sonic.noasm" \
            -ldflags "-X github.com/cosmos/cosmos-sdk/version.Name=Norynth -X github.com/cosmos/cosmos-sdk/version.AppName=norynthd -X github.com/cosmos/cosmos-sdk/version.Version=${GITHUB_REF#refs/tags/v} -X github.com/cosmos/cosmos-sdk/version.Commit=${GITHUB_SHA}" \
            ./cmd/norynthd
        env:
          LD_LIBRARY_PATH: /opt/wasmvm
          DO_NOT_TRACK: 1
          GOFLAGS: "-buildvcs=false"

      - name: Verify binary runs
        run: |
          LD_LIBRARY_PATH=/opt/wasmvm release/norynthd-linux-amd64 version --long

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*
          prerelease: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
