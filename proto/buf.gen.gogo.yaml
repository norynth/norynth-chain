# Buf codegen config. Hand-editable — this is NOT auto-generated.
# Changing the filename or path will break `buf generate` (proto-gen).
#
# buf.gen.gogo.yaml
#
version: v1
plugins:
  - name: gocosmos
    out: .
    opt:
      - plugins=grpc
      - Mgoogle/protobuf/any.proto=github.com/cosmos/cosmos-sdk/codec/types
      - Mcosmos/orm/v1/orm.proto=cosmossdk.io/orm
  - name: grpc-gateway
    out: .
    opt:
      - logtostderr=true
      - allow_colon_final_segments=true
