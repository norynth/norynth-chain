# Buf codegen config. Hand-editable — this is NOT auto-generated.
# Changing the filename or path will break `buf generate` (proto-gen).
#
# buf.gen.ts.yaml
#
version: v1
managed:
  enabled: true
plugins:
  - plugin: buf.build/community/stephenh-ts-proto
    out: .
    opt:
      - logtostderr=true
      - allow_merge=true
      - json_names_for_fields=false
      - ts_proto_opt=snakeToCamel=true
      - ts_proto_opt=esModuleInterop=true
      - ts_proto_out=.
